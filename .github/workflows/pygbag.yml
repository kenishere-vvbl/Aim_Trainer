
name: pygbag_build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pygbag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pygbag
        run: |
          python -m pip install --upgrade pygbag

      - name: Build game
        run: |
          python -m pygbag --build $GITHUB_WORKSPACE/main.py

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
